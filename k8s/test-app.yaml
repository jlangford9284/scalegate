---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-app-script
  namespace: default
data:
  server.py: |
    import http.server
    import socketserver
    import urllib.parse
    
    active_tasks = 0
    
    class Handler(http.server.SimpleHTTPRequestHandler):
        def do_GET(self):
            global active_tasks
            parsed = urllib.parse.urlparse(self.path)
            
            if parsed.path == "/metrics":
                self.send_response(200)
                self.send_header("Content-type", "text/plain")
                self.end_headers()
                self.wfile.write(f"scalegate_active_tasks {active_tasks}\n".encode())
            elif parsed.path == "/start":
                active_tasks += 1
                self.send_response(200)
                self.send_header("Content-type", "text/plain")
                self.end_headers()
                self.wfile.write(f"Started job. Active tasks: {active_tasks}\n".encode())
            elif parsed.path == "/finish":
                if active_tasks > 0:
                    active_tasks -= 1
                self.send_response(200)
                self.send_header("Content-type", "text/plain")
                self.end_headers()
                self.wfile.write(f"Finished job. Active tasks: {active_tasks}\n".encode())
            else:
                self.send_response(404)
                self.end_headers()

    with socketserver.TCPServer(("", 8080), Handler) as httpd:
        print("Serving at port 8080")
        httpd.serve_forever()

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
        scalegate.io/enabled: "true"
    spec:
      containers:
      - name: server
        image: python:3.9-slim
        command: ["python", "-u", "/app/server.py"]
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: script
          mountPath: /app
        lifecycle:
          preStop:
            exec:
              command:
              - python
              - -c
              - |
                import urllib.request, time
                while True:
                    try:
                        req = urllib.request.urlopen("http://localhost:8080/metrics")
                        content = req.read().decode()
                        count = 0
                        for line in content.split("\n"):
                            if line.startswith("scalegate_active_tasks"):
                                count = int(line.split()[1])
                        if count == 0:
                            break
                    except Exception as e:
                        print("Error checking metrics:", e)
                        break
                    time.sleep(2)
      volumes:
      - name: script
        configMap:
          name: test-app-script
