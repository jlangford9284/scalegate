---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scalegate
  namespace: scalegate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scalegate
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "patch"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: scalegate
subjects:
- kind: ServiceAccount
  name: scalegate
  namespace: scalegate
roleRef:
  kind: ClusterRole
  name: scalegate
  apiGroup: rbac.authorization.k8s.io
